<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JhoTopUpGames</title>
    <style>
        body {
            background-color: #fff;
            color: #333;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: #ff0000; /* Merah */
            padding: 20px;
            text-align: center;
            color: white;
        }
        h1 {
            margin: 0;
        }
        .game-list {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .game-card {
            border: 1px solid #ccc;
            padding: 10px;
            width: 150px;
            text-align: center;
        }
        .payment-methods {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .payment-method {
            margin: 0 10px;
            width: 50px;
            height: 50px;
            background-size: cover;
        }
    </style>
</head>
<body>
    <header>
        <h1>JhoTopUpGames</h1>
        <p>Top Up Game Mudah dan Cepat</p>
    </header>
    
    <div class="game-list">
        <div class="game-card">
            <h2>Mobile Legends</h2>
            <p>Top up Mobile Legends dengan mudah</p>
        </div>
        <div class="game-card">
            <h2>Free Fire</h2>
            <p>Top up Free Fire terbaik</p>
        </div>
        <div class="game-card">
            <h2>PUBG Mobile</h2>
            <p>Top up PUBG Mobile untuk kemenanganmu</p>
        </div>
    </div>

    <div class="payment-methods">
        <div class="payment-method" style="background-image: url('https://example.com/dana-logo.png');"></div>
        <div class="payment-method" style="background-image: url('https://example.com/gopay-logo.png');"></div>
        <div class="payment-method" style="background-image: url('https://example.com/ovo-logo.png');"></div>
        <div class="payment-method" style="background-image: url('https://example.com/bank-logo.png');"></div>
        <div class="payment-method" style="background-image: url('https://example.com/qris-logo.png');"></div>
    </div>
</body>
</html>
